apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo
spec:
  replicas: 5
  strategy:
    canary:
      steps:
        - setWeight: 20      # 카나리 20%
        - pause: {duration: 30s}
        - setWeight: 40
        - pause: {}          # 무기한 대기 → 사람이 promote 해야 진행
        - setWeight: 60
        - pause: {duration: 30s}
        - setWeight: 80
        - pause: {duration: 30s}
  revisionHistoryLimit: 2
  selector:
    matchLabels: {app: demo}
  template:
    metadata:
      labels: {app: demo}
    spec:
      containers:
        - name: demo
          image: argoproj/rollouts-demo:blue
          ports: [{containerPort: 8080}]
          resources:
            requests: {memory: 32Mi, cpu: 5m}
---
apiVersion: v1
kind: Service
metadata:
  name: demo
spec:
  selector: {app: demo}
  ports: [{port: 80, targetPort: 8080}]
